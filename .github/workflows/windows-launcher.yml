name: Windows launcher smoke
on:
  push:
    branches: [prison-0.5.1-launcher]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify CMD startup paths
        shell: pwsh
        run: ./scripts/windows-launcher-smoke.ps1
